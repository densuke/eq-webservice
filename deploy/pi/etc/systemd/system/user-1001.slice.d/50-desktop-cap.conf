# 別のユーザー (UID 1001。学習用のデスクトップ) の上限。配信を優先するため。
# /etc/systemd/system/user-<uid>.slice.d/50-desktop-cap.conf に置き、systemctl daemon-reload
[Slice]
# コア 0・1 は配信の取り分。2 コアに絞るので CPUQuota は付けない
AllowedCPUs=2-3
# 超えると遅くなる (強制終了しない)。実測は 2.2GB
MemoryHigh=4G
# ここで強制終了
MemoryMax=5G
MemorySwapMax=2G
# ディスクの取り合いでは配信側を優先
IOWeight=50
