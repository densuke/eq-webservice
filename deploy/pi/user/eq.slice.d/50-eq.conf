# ~/.config/systemd/user/eq.slice.d/50-eq.conf に置く。配信・見張り・再現動画を作る係をまとめる slice
[Slice]
# 配信を、同じユーザーのほかの処理より優先する
CPUWeight=1000
# 配信のメモリを守る。足りなくなったとき、守られていないデスクトップやログイン画面のメモリから先にスワップへ出す。
# 親の階層 (user@<uid>.service) にも MemoryLow が要る (memory_recursiveprot。deploy/pi/etc/systemd/system/user@1000.service.d)
MemoryLow=512M
