# e2 (e2-micro) から YouTube へ直接配信する設定 (native・無音)。~/work/eq-e2cast/cast.toml に置く。
# deploy/eq-broadcast.service の WorkingDirectory (~/work/eq-e2cast) から相対で読む。
# ストリームキーは書かない (環境変数 YOUTUBE_LIVE_API_KEY を、権限 600 のファイルから systemd が渡す)。

source = "native"
# データ (地震情報・警報・天気・BGM の曲名) の取得先
server = "https://eq.fuga.jp"
# 地図のデータ (web/public の japan.geojson・warning-areas.geojson・neighbors.geojson をコピーしておく)
map_dir = "map"
# apt install fonts-noto-cjk
font = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
label = "配信元: e2"

# 地震の画面 10fps・平時 2fps
fps = 10
fps_calm = 2
# 無音 (audio を省く)
audio_bitrate = "32k"
# CRF だけにして、x264 の先読みと threads を減らしてメモリを抑える (平時の送信量は約 216kbps)。
# 可変 fps (fps_calm) では -maxrate / -bufsize を付けない: 入力が 25fps とみなされ、VBV が 1 コマを maxrate/25 に絞って、平時 2fps の画面が崩れる
encode = ["-threads", "1", "-c:v", "libx264", "-preset", "veryfast", "-tune", "zerolatency", "-crf", "23"]

# テスト配信 (記録の地震を流すなど) のときだけ true にする。赤い帯と TEST の透かしが必ず出る。
# server が replay のサーバのときは、true でないと配信を始めない。
# テストの送り先は、本番とは別の配信 (限定公開) のストリームキーにすること。
# test = true

# 送り先 (ffmpeg の引数)。$VAR は環境変数に置き換え、ログでは伏せる
output = ["-f", "flv", "rtmps://a.rtmps.youtube.com/live2/$YOUTUBE_LIVE_API_KEY"]

# 直近 15 分の録画 (ring) と、地震のときの切り出し (archive)。使うときは、上の output をこれに置き換え、[record] を足す。
# ディスクの空きは少ないので (e2 は約 3.8GB)、keep と min_free_mb で抑える。詳しくは README の「配信の録画のリングバッファ」
# output = ["-f", "tee",
#   "[f=flv:onfail=abort]rtmps://a.rtmps.youtube.com/live2/$YOUTUBE_LIVE_API_KEY|[f=segment:segment_time=60:segment_wrap=20:reset_timestamps=1:onfail=ignore]ring/%02d.ts"]
# [record]
# ring_dir = "ring"
# archive_dir = "archive"
# before_min = 5
# after_min = 10
# keep = 20
# min_free_mb = 500
