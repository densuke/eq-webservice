[workspace]
resolver = "2"
members = ["crates/eq-core", "crates/eq-server"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.9.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 配布バイナリを小さくする (デバッグ情報を除き、LTO を効かせる)
strip = true
lto = "thin"
