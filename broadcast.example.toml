# eq-server broadcast の設定例。broadcast.toml にコピーして使う。
# 起動: set -a; . ~/.config/youtube-live-eq-webservice; set +a; eq-server broadcast broadcast.toml
#   (ストリームキーは環境変数で渡す。このファイルには書かない)

# 開くページ (?broadcast=1 で操作ボタンを隠し、警戒音と BGM を最初から鳴らす)
# &sink=<出力先の名前の一部> で、ページの音をその機器へ流す (Mac 全体の出力先は変えない)
url = "https://eq.fuga.jp/?broadcast=1&sink=BlackHole%202ch"
width = 1280
height = 720
fps = 30

# Chrome (Mac の既定。Linux / Raspberry Pi は "chromium")
# chrome = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# Chrome のプロファイルの場所 (普段使いの Chrome とは別)。省くと毎回まっさらな一時ディレクトリ
# profile = "chrome-profile"
# Linux で音を PulseAudio の配信用の出力に流す場合
# chrome_env = { PULSE_SINK = "eq_broadcast" }

# 音の取り込み。省くと無音
# Mac: BlackHole 2ch に流した Chrome の音を sox で取り込む (brew install sox)。
#   ffmpeg の avfoundation は音を 1 割ほど落として途切れるので使わない。出力は s16le・48kHz・ステレオにする
audio_command = ["sox", "-q", "-t", "coreaudio", "BlackHole 2ch", "-t", "raw", "-r", "48000", "-c", "2", "-e", "signed-integer", "-b", "16", "-"]
# Linux: PulseAudio の配信用の出力のモニタ (ffmpeg の入力の引数)
# audio = ["-f", "pulse", "-i", "eq_broadcast.monitor"]

# 圧縮 (ffmpeg の引数)。既定は x264 (Raspberry Pi 5 にはハードの H.264 エンコーダが無い)
# encode = ["-c:v", "libx264", "-preset", "veryfast", "-b:v", "3000k", "-maxrate", "3000k", "-bufsize", "6000k"]

# 送り先 (ffmpeg の引数)。$VAR は環境変数に置き換え、ログでは伏せる
output = ["-f", "flv", "rtmps://a.rtmps.youtube.com/live2/$YOUTUBE_LIVE_API_KEY"]
# 手元で確かめるだけならファイルに保存する
# output = ["-t", "60", "-f", "mpegts", "broadcast-test.ts"]
