# eq-server 設定例。config.toml にコピーして使う。
# 起動: eq-server --config config.toml

[server]
# Caddy などのリバースプロキシの裏に置く場合はループバックで待ち受ける
listen = "127.0.0.1:8080"
# フロントエンドのビルド成果物 (cd web && npm run build)
static_dir = "web/dist"
# ブラウザ接続時にまとめて送る直近イベント数
recent_capacity = 200
# WebSocket (/ws) の接続制限。X-Forwarded-For は、直接の相手がここに載るプロキシのときだけ信じる
# (最も右の値を接続元 IP とする)。載っていない相手には無視して、相手の IP をそのまま使う
trusted_proxies = ["127.0.0.1", "::1"]
# 1 つの IP からの同時接続数と、1 分あたりの接続回数 (超えると 429)
max_ws_per_ip = 32
ws_connects_per_min = 30
# Origin 付き (ブラウザ) の接続で許す origin。自分の Host と同じ origin は常に許可、それ以外は 403
# allowed_origins = ["https://eq.example.jp"]

[source]
type = "p2pquake"
url = "wss://api.p2pquake.net/v2/ws"
history_url = "https://api.p2pquake.net/v2/history"
history_limit = 30
# 現在の津波予報 (履歴 API には含まれないため別に取得する)
tsunami_url = "https://api.p2pquake.net/v2/jma/tsunami"
# 緊急地震速報の予報も受け取る (P2P地震情報は警報のみ)。Wolfx Open API (非公式の中継)。
# 利用規約 https://wolfx.jp/legal/terms を確認のうえ有効にする。空文字で無効
eew_url = ""

# 地震が起きていないときの画面確認用: 記録データを「今」の時刻にずらして再生する
# [source]
# type = "replay"
# path = "samples/scenarios/standard.jsonl"
# speed = 1.0
# max_gap_ms = 10000
# rebase_time = true
# loop = true

# 平常時に画面上部で切り替えて表示する文 (出典と注意書きのあとに足される)
[telop]
messages = []
# messages = ["保守のため 10/1 3:00〜3:10 に停止します"]

# ---- 配信先プラグイン ----
# 共通キー: type (必須) / name / enabled / kinds / min_scale
#   kinds     : "quake" (地震情報) / "eew" (緊急地震速報) / "eew_detection" / "tsunami" / "userquake" (地震感知情報)。省略で userquake 以外すべて
#   min_scale : "1".."4", "5弱"(or "5-"), "5強", "6弱", "6強", "7"。地震情報・EEW にのみ効く

# RSS: /feed.xml で配信し、再起動しても蓄積を引き継ぐ
[[sinks]]
type = "rss"
kinds = ["quake", "tsunami"]
route = "/feed.xml"
state_path = "data/rss-state.json"
title = "地震情報"
link = "https://example.com/"
max_items = 50

# 受信した全イベントを JSON Lines で蓄積。書き込みは path の隣の日付ごとのファイル
# (data/events-YYYY-MM-DD.jsonl、書いた時刻の UTC の日付)。path 自体 (分割前のファイル) があれば、読むときだけ使う
[[sinks]]
type = "jsonl"
path = "data/events.jsonl"

# Discord Webhook (URL は環境変数から読む)
[[sinks]]
type = "discord"
enabled = false
kinds = ["quake", "eew", "tsunami"]
min_scale = "3"
webhook_url_env = "DISCORD_WEBHOOK_URL"
username = "地震情報"

# 任意の URL に正規化済み JSON を POST
[[sinks]]
type = "webhook"
enabled = false
url = "http://127.0.0.1:9000/hook"
# headers = { Authorization = "Bearer xxx" }

# 気象警報・注意報 (平時の地図に出す)。気象庁防災情報XML の集約通報を定期的に取得する
[weather]
enabled = true
# feed_url = "https://www.data.jma.go.jp/developer/xml/feed/regular.xml"

# 平時の BGM。音楽は Icecast が配信し (送り出しは eq-server bgm-send、前処理は tools/bgm_prepare.sh)、画面はその URL を鳴らす。
# 同じサイトの中の URL にする (リバースプロキシで Icecast へ中継する)。空なら使わない
[bgm]
stream = ""
# stream = "stream/bgm.mp3"
# status = "stream/status-json.xsl"

# 平時のバナー (案内・お知らせ)。ディレクトリの画像 (png/jpg/webp/gif) とテキスト (.txt) を名前順に切り替える。空なら使わない
[banner]
dir = ""
# dir = "/home/eq/banner"
interval_sec = 20

# YouTube ライブの同時視聴者数 (GET /api/viewers。web のヘッダーに「同接 N 人」)。既定は無効。
# 認証は api_key か token_file のどちらか 1 つ、動画は video_id か channel_id のどちらか 1 つを指定する
[viewers]
enabled = false
interval_sec = 60
# api_key = "..."                              # YouTube Data API v3 のキー
# token_file = "~/.config/pd2/youtube-upload-token.json"  # OAuth の資格情報 JSON (refresh_token で取り直す。~ は展開されないので絶対パスで)
# video_id = "qs2MfxEgBA0"                     # 動画を固定する
# channel_id = "UC..."                         # 今の live を探す (OAuth は liveBroadcasts、キーは search で 100 単位 (30 分以上あけて探す)。見つけたら覚える)

# 画面の並びの定義 (JSON)。書き換えてブラウザを再読み込みすれば変わる (再起動は不要)。
# 空なら組み込みの定義 (web/src/layout.json)。正しくない定義は、画面が組み込みの定義を使う
[layout]
file = ""
# file = "data/layout.json"

# 音声アナウンス (Google Cloud Text-to-Speech)。秘密情報は設定ファイルに書かず、環境変数で渡す
#   GOOGLE_TTS_API_KEY: Google の API キー (未設定なら enabled = true でも警告を出して無効)
#   EQ_TTS_TOKEN: POST /api/tts の Bearer トークン (未設定ならこの窓口は無効)
[tts]
enabled = false
# voice = "ja-JP-Neural2-B"
# cache_dir = "data/tts"
# monthly_char_limit = 900000
# prewarm = true
# POST /api/tts/announce (公開) の、接続元 IP ごとの 1 分あたりの回数。超えると 429
# announce_per_min = 12
