[package]
name = "eq-server"
description = "地震情報を上流 WebSocket から受信し、ブラウザ・各種プラグインへ配信するサーバ"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
# posix_fadvise (書いたファイルのページキャッシュを捨てる)。tokio が既に引いている
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net", "process", "io-util"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roxmltree = "0.21.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
tiny-skia = "0.12"
# 天気アイコンの SVG を描くだけ (文字は使わない。一部のアイコンは PNG を埋め込むので画像は要る)
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
ab_glyph = "0.2"
# encoder = "builtin": H.264 の圧縮 (Cisco の OpenH264、BSD。ソースから組み込む) と RTMPS の TLS
openh264 = { version = "0.9", features = ["source"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# tts: キャッシュのファイル名 (sha256) と Google の応答 (base64)
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
