[package]
name = "eq-server"
description = "地震情報を上流 WebSocket から受信し、ブラウザ・各種プラグインへ配信するサーバ"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net", "process", "io-util"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roxmltree = "0.21.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
tiny-skia = "0.12"
fontdue = "0.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
